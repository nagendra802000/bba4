<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My BBA Study App</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 30px 20px;
        }

        .header {
            background: linear-gradient(135deg, #172554, #2563eb);
            color: white;
            padding: 40px 25px;
            border-radius: 18px;
            text-align: center;
        }

        .card {
            background: white;
            margin-top: 20px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 18px rgba(0,0,0,.07);
        }

        .button {
            display: inline-block;
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>BBA Semester 4</h1>
        <p>Personal Learning Dashboard</p>
    </div>

    <div class="card">
        <h2>Welcome Back!</h2>

        <p>
            This will become my personal BBA learning application.
        </p>

        <p>
            Management of Technology — Units 1–7
        </p>

        <a href="#" class="button">
            Continue Learning
        </a>
    </div>

</div>

</body>
</html>
